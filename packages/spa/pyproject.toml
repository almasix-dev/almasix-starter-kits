[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-starter-kit-spa"
version = "0.1.0"
description = "Almasix SPA starter kits — Inertia React/Vue/Svelte overlays for almasix new"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix>=0.9.4",
    "almasix-inertia>=0.1.0",
]
readme = "README.md"

[project.entry-points."almasix.kits"]
react = "almasix_starter_kit_spa:react"
vue = "almasix_starter_kit_spa:vue"
svelte = "almasix_starter_kit_spa:svelte"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-starter-kits"
Repository = "https://github.com/almasix-dev/almasix-starter-kits"
Issues = "https://github.com/almasix-dev/almasix-starter-kits/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix_starter_kit_spa"]

[tool.hatch.build.targets.sdist]
include = ["/src/almasix_starter_kit_spa", "/README.md", "/LICENSE"]
