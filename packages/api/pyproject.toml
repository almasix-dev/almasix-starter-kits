[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-starter-kit-api"
version = "0.1.0"
description = "Almasix API starter kit — Signet PAT overlays for almasix new --kit api"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix>=0.9.3",
]
readme = "README.md"

[project.entry-points."almasix.kits"]
api = "almasix_starter_kit_api:register"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-starter-kits"
Repository = "https://github.com/almasix-dev/almasix-starter-kits"
Issues = "https://github.com/almasix-dev/almasix-starter-kits/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix_starter_kit_api"]

[tool.hatch.build.targets.sdist]
include = ["/src/almasix_starter_kit_api", "/README.md", "/LICENSE"]
