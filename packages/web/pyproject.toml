[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-starter-kit-web"
version = "0.1.1"
description = "Almasix Web starter kit — Prism + Conduit overlays for almasix new --kit web"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix>=0.9.4",
    "almasix-conduit>=0.2.0",
]
readme = "README.md"

[project.entry-points."almasix.kits"]
web = "almasix_starter_kit_web:register"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-starter-kits"
Repository = "https://github.com/almasix-dev/almasix-starter-kits"
Issues = "https://github.com/almasix-dev/almasix-starter-kits/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix_starter_kit_web"]

[tool.hatch.build.targets.sdist]
include = ["/src/almasix_starter_kit_web", "/README.md", "/LICENSE"]
